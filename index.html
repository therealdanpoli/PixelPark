<script>
'use strict';
/* ================= constants ================= */
const N=34,HW=32,HH=16,EXT=3,GX=N>>1,OX=(N+EXT)*HW,OY=160;
const WW=(2*N+EXT)*HW,WH=(2*N+EXT)*HH+OY+10,DAY=2.5,KEY='pocket-funfair-v3';
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DIRS=[[1,0],[0,1],[-1,0],[0,-1]];
const RIDES={
 bouncy:{n:'Bouncy Castle',s:2,cost:3000,exc:22,nau:4,cap:4,dur:9,wear:2.0,hh:50},
 cups:{n:'Spinning Cups',s:2,cost:4500,exc:30,nau:16,cap:6,dur:8,wear:2.8,hh:28},
 slide:{n:'Spiral Slide',s:2,cost:5000,exc:28,nau:8,cap:3,dur:5,wear:1.5,hh:95},
 carousel:{n:'Carousel',s:2,cost:7000,exc:36,nau:8,cap:8,dur:10,wear:2.5,hh:75},
 maze:{n:'Hedge Maze',s:3,cost:8000,exc:32,nau:0,cap:10,dur:14,wear:.6,hh:30},
 swinger:{n:'Wave Swinger',s:2,cost:9000,exc:40,nau:18,cap:8,dur:9,wear:2.6,hh:82},
 dodgems:{n:'Dodgems',s:3,cost:10000,exc:42,nau:10,cap:10,dur:10,wear:3,hh:42},
 ferris:{n:'Big Wheel',s:3,cost:12000,exc:46,nau:6,cap:10,dur:12,wear:2.7,hh:135},
 ship:{n:'Swinging Galleon',s:3,cost:16000,exc:58,nau:30,cap:10,dur:9,wear:3.3,hh:100},
 twister:{n:'Twister',s:3,cost:17000,exc:60,nau:36,cap:8,dur:8,wear:3.4,hh:45},
 haunted:{n:'Spook Manor',s:3,cost:19000,exc:62,nau:10,cap:8,dur:11,wear:2.3,hh:105},
 drop:{n:'Sky Drop',s:2,cost:26000,exc:78,nau:38,cap:6,dur:7,wear:3.8,hh:140},
 flume:{n:'Log Flume',s:4,cost:30000,exc:74,nau:16,cap:9,dur:12,wear:3,hh:60},
 coaster:{n:'Roller Coaster',s:4,cost:42000,exc:95,nau:42,cap:12,dur:10,wear:4.2,hh:75}};
const SHOPS={
 burger:{n:'Burger Bar',cost:1500,price:5,tw:'Fat content',e:'🍔',sp:'burger',col:'#ff6b5e'},
 drinks:{n:'Fizzy Drinks',cost:1200,price:3.5,tw:'Ice',e:'🥤',sp:'drink',col:'#4aa8ff'},
 fries:{n:'Fries Stand',cost:1200,price:3.5,tw:'Salt',e:'🍟',sp:'fries',col:'#ffcf3f'},
 candy:{n:'Candy Floss',cost:1100,price:3,tw:'Sugar',e:'🍭',sp:'candy',col:'#ff9ecf'},
 ice:{n:'Ice Cream',cost:1400,price:4,tw:'Sugar',e:'🍦',sp:'ice',col:'#7be0d6'},
 coffee:{n:'Coffee Hut',cost:1600,price:4,tw:'Caffeine',e:'☕',sp:'coffee',col:'#a9744f'},
 pizza:{n:'Pizza Parlour',cost:2600,price:8,tw:'Toppings',e:'🍕',sp:'pizza',col:'#ff9f43'},
 balloon:{n:'Balloon Cart',cost:1000,price:6,tw:null,e:'🎈',sp:null,col:'#b388ff'},
 gift:{n:'Gift Shop',cost:2400,price:8,tw:null,e:'🎁',sp:'gift',col:'#b388ff'},
 ducks:{n:'Hook-a-Duck',cost:2000,price:3,tw:'Win chance',e:'🦆',sp:'duck',col:'#3bb273'},
 coconut:{n:'Coconut Shy',cost:2200,price:4,tw:'Win chance',e:'🥥',sp:'coconut',col:'#2ec4b6'},
 toilet:{n:'Toilets',cost:1800,price:0,tw:null,e:'🚻',sp:'wc',col:'#4aa8ff'},
 firstaid:{n:'First Aid',cost:2000,price:0,tw:null,e:'🩹',sp:'firstaid',col:'#ff6b5e'},
 atm:{n:'Cash Machine',cost:2500,price:0,tw:null,e:'🏧',sp:'cash',col:'#3bb273'}};
const SCEN={tree:{n:'Tree',cost:120,b:1},flowers:{n:'Flower Bed',cost:150,b:1.2},lamp:{n:'Lamp',cost:100,b:.6},fountain:{n:'Fountain',cost:900,b:3}};
const STAFF={handy:{n:'Handyman',wage:120,e:'🧹',d:'Sweeps up litter and worse.'},mech:{n:'Mechanic',wage:180,e:'🔧',d:'Fixes rides before they explode.'},ent:{n:'Entertainer',wage:150,e:'🤹',d:'Costumed cheer for guests nearby, queues included.'},guard:{n:'Security Guard',wage:160,e:'👮',d:'Chases troublemakers out of the park.'}};
const RES=[['fries',600],['carousel',900],['candy',700],['ice',900],['swinger',1400],['balloon',800],['maze',1200],['coffee',1200],['gift',1200],['fountain',800],['dodgems',1800],['ferris',1900],['ducks',1200],['pizza',1500],['ship',2400],['coconut',1300],['twister',2600],['firstaid',1200],['haunted',2800],['atm',1500],['flume',3400],['drop',3600],['coaster',4500]];
const HAIR=['#8b5a2b','#151a45','#ffcf3f','#ff9f43','#555555'],PANTS=['#27306b','#5b5f6b','#8b5a2b','#3b2f55'];
const KN={adult:'Grown-up',teen:'Teenager',kid:'Kid',senior:'Pensioner',thug:'Troublemaker'};
const nov=b=>clamp(1.2-(G.t-(b.born||0))/(720*DAY)*.35,.85,1.2);
const SHIRTS=['#ff6b5e','#4aa8ff','#ffcf3f','#3bb273','#b388ff','#ff9ecf','#ffffff','#ff9f43','#2ec4b6'];
const SKINS=['#ffd9b3','#f1c27d','#c68642','#8d5524','#ffe0bd'];
const DEF=(k,t)=>k==='ride'?RIDES[t]:k==='shop'?SHOPS[t]:SCEN[t];
const $=id=>document.getElementById(id);
const rnd=Math.random,clamp=(v,a,b)=>v<a?a:v>b?b:v,pick=a=>a[(rnd()*a.length)|0];
const I=(x,y)=>y*N+x,inb=(x,y)=>x>=0&&y>=0&&x<N&&y<N;
const wx=(x,y)=>(x-y)*HW+OX,wy=(x,y)=>(x+y)*HH+OY;
const money=n=>(n<0?'-$':'$')+Math.abs(Math.round(n)).toLocaleString('en-US');
/* ================= state ================= */
let tile,occ,lit,qRide,qDist,qCount,exitD,pathD,beauty;
let B=[],guests=[],staff=[],G=null,tool=null,ghost=null,navDirty=true,groundDirty=true,bus=null,paused=true,T=0;
let sheet=null,said={},fx=[];
const cam={x:0,y:0,z:1};
function newFin(){return{tickets:0,shops:0,build:0,wages:0,research:0,stock:0,interest:0,sold:0,awards:0,marketing:0}}
function newGame(){
 tile=new Uint8Array(N*N);occ=new Array(N*N).fill(null);lit=new Uint8Array(N*N);
 B=[];guests=[];staff=[];bus=null;tool=null;ghost=null;said={};fx=[];
 G={money:30000,loan:0,t:0,day:0,ticket:20,rating:50,resB:400,resP:0,resI:0,
  unl:{bouncy:1,cups:1,slide:1,burger:1,drinks:1,toilet:1,tree:1,flowers:1,lamp:1},
  speed:1,busT:4,fin:newFin(),last:null,nid:1,sound:true,debtM:0,over:false,
  rivals:[{n:'Wobble World',v:70000},{n:'Gigglesworth Gardens',v:95000},{n:'Captain Chunder\'s Cove',v:125000},{n:'Megacoaster Mile',v:170000}],
  avg:{happy:60,hunger:0,thirst:0,bladder:0},litter:0,turned:0,rain:false,wT:40,adT:0,yrRate:0,yrLit:0,yrN:0,yrGuests:0,rt:0,at:3};
 for(let y=N-5;y<N;y++)tile[I(GX,y)]=1;
 for(let x=GX-2;x<=GX+2;x++)tile[I(x,N-5)]=1;
 navDirty=groundDirty=true;
 cam.z=PX/2;centerOn(GX+.5,N-6);
}
function centerOn(x,y){cam.x=wx(x,y)-VW/2/cam.z;cam.y=wy(x,y)-VH/2/cam.z}
function earn(a,c){G.money+=a;G.fin[c]+=a}
function spend(a,c){G.money-=a;G.fin[c]+=a}
/* ================= audio ================= */
let AC=null;
function beep(f,d,type,v){if(!G||!G.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=f;g.gain.value=v||.04;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const sBuild=()=>{beep(330,.08);setTimeout(()=>beep(495,.1),70)},sErr=()=>beep(120,.15,'sawtooth'),sCash=()=>{beep(880,.06,'triangle',.05);setTimeout(()=>beep(1320,.1,'triangle',.05),60)};
/* ================= buildings ================= */
function mkB(kind,t,x,y){
 const d=DEF(kind,t),b={id:G.nid++,kind,t,x,y,s:d.s||1};
 if(kind==='ride')Object.assign(b,{open:true,state:'load',riders:[],wait:[],cond:100,maxCond:100,speed:3,ph:rnd()*6,lt:0,rt:0,total:0,broken:false,brokenT:0,boom:0,born:G.t,mech:null,hasQ:false,touch:false,exit:null});
 if(kind==='shop')Object.assign(b,{price:d.price,tw:2,sold:0,profit:0});
 B.push(b);for(let j=0;j<b.s;j++)for(let i=0;i<b.s;i++){occ[I(x+i,y+j)]=b;lit[I(x+i,y+j)]=0}
 navDirty=true;return b}
function canPlace(kind,t,x,y){const s=DEF(kind,t).s||1;for(let j=0;j<s;j++)for(let i=0;i<s;i++){if(!inb(x+i,y+j))return false;const k=I(x+i,y+j);if(occ[k]||tile[k])return false}return true}
function demolish(b,free){
 const k=B.indexOf(b);if(k<0)return;B.splice(k,1);b.dead=true;
 for(let j=0;j<b.s;j++)for(let i=0;i<b.s;i++)occ[I(b.x+i,b.y+j)]=null;
 if(b.kind==='ride'){for(const g of b.riders)eject(g,b);b.riders=[];if(b.mech){b.mech.target=null;b.mech.route=null}}
 if(!free)G.money+=Math.round(DEF(b.kind,b.t).cost*.4);
 navDirty=true}
function perim(b,fn){for(let k=0;k<b.s;k++){fn(b.x+k,b.y-1);fn(b.x+k,b.y+b.s);fn(b.x-1,b.y+k);fn(b.x+b.s,b.y+k)}}
function bfs(arr,src,pass){arr.fill(-1);const q=src.slice();for(const i of q)arr[i]=0;for(let k=0;k<q.length;k++){const i=q[k],x=i%N,y=(i/N)|0;for(const[dx,dy]of DIRS){const nx=x+dx,ny=y+dy;if(!inb(nx,ny))continue;const j=I(nx,ny);if(arr[j]<0&&pass(j)){arr[j]=arr[i]+1;q.push(j)}}}}
function rebuildNav(){
 navDirty=false;
 qRide=new Array(N*N).fill(null);qDist=new Int16Array(N*N).fill(-1);qCount=new Uint8Array(N*N);
 exitD=new Int16Array(N*N);pathD=new Int16Array(N*N);beauty=new Float32Array(N*N);
 for(const b of B){
  if(b.kind==='scen'){const v=SCEN[b.t].b;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)if(inb(b.x+dx,b.y+dy))beauty[I(b.x+dx,b.y+dy)]+=v;continue}
  if(b.kind!=='ride')continue;
  const q=[];b.exit=null;b.touch=false;
  perim(b,(x,y)=>{if(!inb(x,y))return;const i=I(x,y);if(tile[i]===2&&!qRide[i]){qRide[i]=b;qDist[i]=0;q.push(i)}});
  for(let k=0;k<q.length;k++){const i=q[k],x=i%N,y=(i/N)|0;for(const[dx,dy]of DIRS){const nx=x+dx,ny=y+dy;if(!inb(nx,ny))continue;const j=I(nx,ny);if(tile[j]===2&&!qRide[j]){qRide[j]=b;qDist[j]=qDist[i]+1;q.push(j)}}}
  b.hasQ=q.length>0;
  perim(b,(x,y)=>{if(!b.exit&&inb(x,y)&&tile[I(x,y)]===1){b.exit=[x,y];b.touch=true}});
  for(let k=q.length-1;k>=0&&!b.exit;k--){const i=q[k],x=i%N,y=(i/N)|0;for(const[dx,dy]of DIRS){const nx=x+dx,ny=y+dy;if(inb(nx,ny)&&tile[I(nx,ny)]===1){b.exit=[nx,ny];b.touch=true;break}}}
  if(!b.exit)perim(b,(x,y)=>{if(!b.exit&&inb(x,y)&&!occ[I(x,y)])b.exit=[x,y]});
  if(!b.exit)b.exit=[b.x,b.y];
 }
 bfs(exitD,[I(GX,N-1)],j=>tile[j]===1);
 const src=[];for(let i=0;i<N*N;i++)if(tile[i]===1)src.push(i);
 bfs(pathD,src,j=>!occ[j]);
 for(const g of guests){
  if(g.st==='q'){const i=g.qi;if(i<0||tile[i]!==2||qRide[i]!==g.ride||g.ride.dead){g.st='walk';g.ride=null;g.qi=-1;g.head=false}else qCount[i]++}
 }
 for(const b of B)if(b.kind==='ride')b.wait=b.wait.filter(g=>g.st==='q'&&g.ride===b&&g.head);
}
/* ================= movers ================= */
function moveTo(e,nx,ny){e.px=e.x;e.py=e.y;e.fx=e.x;e.fy=e.y;e.tx=nx;e.ty=ny;e.p=0;e.mv=true}
function descend(e){
 const cur=inb(e.x,e.y)?pathD[I(e.x,e.y)]:-1;let best=null,bd=cur<0?1e9:cur;
 for(const[dx,dy]of DIRS){const nx=e.x+dx,ny=e.y+dy;if(!inb(nx,ny))continue;const j=I(nx,ny);if(occ[j]||pathD[j]<0)continue;if(pathD[j]<bd){bd=pathD[j];best=[nx,ny]}}
 if(best){moveTo(e,best[0],best[1]);return true}return false}
function wander(e){
 const opts=[];for(const[dx,dy]of DIRS){const nx=e.x+dx,ny=e.y+dy;if(inb(nx,ny)&&tile[I(nx,ny)]===1)opts.push([nx,ny])}
 if(!opts.length){if(tile[I(e.x,e.y)]!==1)descend(e);return}
 let o=opts;if(opts.length>1){o=opts.filter(p=>p[0]!==e.px||p[1]!==e.py)}
 const p=pick(o);moveTo(e,p[0],p[1])}
function think(g,e){g.th=e;g.tht=2}
function spawnGuest(kind){

function advise(){

 const turned=G.turned;G.turned=0;
 if(!rides.length)return say('Welcome, boss! Draw paths from the gate, then build a ride beside one. The first bus is already on its way.','t0',45);
 const un=rides.find(r=>!r.hasQ&&!r.touch);if(un)return say('Nobody can reach the '+RIDES[un.t].n+'. Run a path or a blue queue line right up to it.','t1',30);

 if(G.litter>6&&!cnt('handy'))return say('The paths are getting grubby. A handyman would sort that out.','handy',40);
 if(rides.length&&!rides.some(r=>r.hasQ))return say('Tip: lay blue queue tiles from a path to a ride so guests can line up instead of wandering past.','t2',120);
 if(G.avg.hunger>55&&!has('burger')&&!has('fries'))return say('Stomachs are rumbling. Build somewhere to eat.','food',50);
 if(G.avg.thirst>55&&!has('drinks')&&!has('coffee'))return say('Everyone is parched. A drinks stall would print money.','drink',50);
 if(G.avg.bladder>50&&!has('toilet'))return say('There is a lot of cross-legged walking going on. Toilets, please.','wc',50);

function zoomAt(px,py,f){const X=px/cam.z+cam.x,Y=py/cam.z+cam.y;cam.z=clamp(cam.z*f,PX*.25,PX*1.5);cam.x=X-px/cam.z;cam.y=Y-py/cam.z}
function clampCam(){cam.x=clamp(cam.x,-VW/cam.z*.6,WW-VW/cam.z*.4);cam.y=clamp(cam.y,-VH/cam.z*.5,WH-VH/cam.z*.4)}
cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){}ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptr.size===1){drag={sx:e.clientX,sy:e.clientY,lx:e.clientX,ly:e.clientY,moved:false,paint:isPaint()};lastPaint=-1}else if(ptr.size===2){drag=null;pinch=pinfo()}});
cv.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptr.size===2&&pinch){const n=pinfo();zoomAt(n.mx,n.my,n.d/pinch.d);cam.x-=(n.mx-pinch.mx)/cam.z;cam.y-=(n.my-pinch.my)/cam.z;pinch=n;clampCam()}
 else if(drag){const dx=e.clientX-drag.lx,dy=e.clientY-drag.ly;drag.lx=e.clientX;drag.ly=e.clientY;if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>8)drag.moved=true;
  if(drag.moved){if(drag.paint)paintAt(e.clientX,e.clientY,false);else{cam.x-=dx/cam.z;cam.y-=dy/cam.z;clampCam()}}}});
function pup(e){if(!ptr.has(e.pointerId))return;ptr.delete(e.pointerId);if(drag&&!drag.moved&&ptr.size===0&&e.type==='pointerup')tap(e.clientX,e.clientY);if(ptr.size<2){if(pinch)snapZoom(0);pinch=null}if(ptr.size===0)drag=null}
cv.addEventListener('pointerup',pup);cv.addEventListener('pointercancel',pup);
const ZS=[.25,.375,.5,.75,1,1.5];let wheelT=0;
function snapZoom(dir,px,py){const s=cam.z/PX;let bi=0;for(let i=1;i<ZS.length;i++)if(Math.abs(ZS[i]-s)<Math.abs(ZS[bi]-s))bi=i;bi=clamp(bi+dir,0,ZS.length-1);zoomAt(px===undefined?VW/2:px,py===undefined?VH/2:py,ZS[bi]*PX/cam.z);clampCam()}
cv.addEventListener('wheel',e=>{e.preventDefault();if(T-wheelT<.12)return;wheelT=T;snapZoom(e.deltaY<0?1:-1,e.clientX,e.clientY)},{passive:false});
/* ================= save / load ================= */
function save(){if(!G||G.over)return;try{localStorage.setItem(KEY,JSON.stringify({v:2,G,tile:Array.from(tile).join(''),lit:Array.from(lit).join(''),B:B.map(b=>({kind:b.kind,t:b.t,x:b.x,y:b.y,price:b.price,tw:b.tw,speed:b.speed,open:b.open,cond:b.cond,maxCond:b.maxCond,total:b.total,sold:b.sold,profit:b.profit,broken:b.broken,born:b.born})),staff:staff.map(s=>s.k)}))}catch(e){}}
function hasSave(){try{return!!localStorage.getItem(KEY)}catch(e){return false}}
function load(){try{const o=JSON.parse(localStorage.getItem(KEY));if(!o||o.v!==2)return false;newGame();Object.assign(G,o.G);tile=Uint8Array.from(o.tile,Number);lit=Uint8Array.from(o.lit,Number);
 for(const s of o.B){const b=mkB(s.kind,s.t,s.x,s.y);for(const k in s)if(s[k]!==undefined&&s[k]!==null)b[k]=s[k]}for(const k of o.staff)hire(k);navDirty=groundDirty=true;return true}catch(e){return false}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
/* ================= main loop ================= */
let lastT=0,hudT=0,hudN=0;
function frame(ts){
 const real=Math.min(.1,(ts-lastT)/1000||0);lastT=ts;T+=real;
 if(!paused&&G.speed>0&&!G.over){let left=real*G.speed;while(left>0){const d=Math.min(.05,left);update(d);left-=d;if(paused||G.over)break}}
 if(navDirty)rebuildNav();
 render();
 hudT-=real;if(hudT<=0){hudT=.3;hud();if(sheet&&sheet.k==='guest'&&++hudN%4===0)refreshSheet()}
 requestAnimationFrame(frame)}
function boot(){
 resize();window.addEventListener('resize',resize);newGame();hud();document.querySelectorAll('[data-e]').forEach(el=>{el.innerHTML=ico(el.dataset.e)});
 modal('<h1>Pocket Funfair</h1><p style="text-align:center">A pint-sized park tycoon. Now in glorious 8-bit.</p><p>🛤️ Lay paths from the gate, drop in rides and shops, and run blue queue lines up to your rides.</p><p>👷 Hire handymen for litter, mechanics for breakdowns, entertainers for grumpy queues.</p><p>💰 Set the ticket price, meddle with the salt on the fries, fund research and climb the park league.</p><p>👆 Drag to move, pinch to zoom, tap anything to inspect it.</p><div class="btns">'+(hasSave()?'<button class="btn" data-a="loadgame">Continue</button>':'')+'<button class="btn '+(hasSave()?'gry':'')+'" data-a="mclose">New park</button></div>');
 requestAnimationFrame(frame)}
ACT.advert=()=>{if(G.adT>0||G.money<2000)return;spend(2000,'marketing');G.adT=150;sCash();refreshSheet()};
ACT.loadgame=()=>{if(!load()){newGame()}hud();ACT.mclose()};
boot();
</script></body></html>
